[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "exocalendar"
version = "0.1.0"
description = "Self-hostable CalDAV calendar server with a clean web UI. Zero runtime dependencies."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []
keywords = ["calendar", "caldav", "icalendar", "self-hosted"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Scheduling",
]

[project.optional-dependencies]
dev = ["pytest", "python-dateutil", "caldav"]

[project.scripts]
exocalendar = "exocalendar.__main__:main"

[tool.setuptools.packages.find]
include = ["exocalendar*"]

[tool.setuptools.package-data]
exocalendar = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
